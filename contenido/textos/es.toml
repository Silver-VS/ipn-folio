caducidad.confirmar_boton = "Cambiar y borrar"
# {fecha}: cuándo se borró; {cuando}: cuándo se borrará solo, dicho en palabras (p. ej. «en 12 días»).
se_borro = "Se borró {fecha}"
se_borrara = "Se borrará {cuando}"
# {n}: elementos borrados antes dentro de un proyecto que también está en la papelera.
incluye_borrados = "Incluye {n, plural, one {# elemento borrado antes} other {# elementos borrados antes}}"
# {proyecto}: nombre del proyecto de donde salió un archivo o carpeta.
de_proyecto = "De {proyecto}"
clase.proyecto = "Proyecto"
clase.carpeta = "Carpeta"
clase.archivo = "Archivo"
# {nombre}: elemento al que se refiere el botón (para lectores de pantalla).
restaurar.boton = "Restaurar"
restaurar.aria = "Restaurar {nombre}"
borrar_definitivo.boton = "Borrar definitivamente"
borrar_definitivo.aria = "Borrar definitivamente {nombre}"
borrar_definitivo.confirmar = "¿Borrar definitivamente {nombre}? No se puede deshacer."
vaciar.boton = "Vaciar papelera"
# {n}: cuántos elementos se borrarían.
vaciar.confirmar = "¿Vaciar la papelera? Se {n, plural, one {borrará definitivamente # elemento} other {borrarán definitivamente # elementos}}. No se puede deshacer."
cancelar.boton = "Cancelar"
# Avisos al restaurar; {ruta}: ruta original, {ruta_final}: la que quedó si la original estaba ocupada.
restaurado = "Se restauró {ruta}."
restaurado_como = "Se restauró como {ruta_final} porque {ruta} ya existía."
# {nombre}: proyecto restaurado.
restaurado_proyecto = "Se restauró el proyecto {nombre}."
abrir_proyecto = "Abrir proyecto"
ver.boton = "Ver toda la papelera"
# {n}: elementos de la papelera que salieron de este proyecto.
del_proyecto = "Papelera de este proyecto ({n})"
del_proyecto_vacia = "No hay nada de este proyecto en la papelera."

