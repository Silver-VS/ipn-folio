exportar = "Exportar .zip"
papelera = "Mover a la papelera"
renombrar_pregunta = "Nuevo nombre para {nombre}"
importar = "Importar .tex o .zip"
carpeta = "Importar carpeta"
soltar = "Arrastra aquí una carpeta o archivos .tex o .zip, o elígelos abajo."
