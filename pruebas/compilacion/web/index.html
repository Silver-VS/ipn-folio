<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba de compilación — IPN Folio</title>
  <style>
    :root { --fondo: #fafafa; --texto: #1d1d1f; --tenue: #6b6b70; --borde: #d9d9de; --guinda: #6c1d45; --ok: #1b7f3b; --mal: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #161618; --texto: #ececef; --tenue: #9a9aa2; --borde: #3a3a40; --guinda: #d77aa6; --ok: #5cc27e; --mal: #f2766c; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--fondo); color: var(--texto); }
    h1 { font-size: 1.3rem; margin: 0 0 4px; color: var(--guinda); }
    p.nota { color: var(--tenue); margin: 0 0 16px; }
    fieldset { border: 1px solid var(--borde); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px; }
    label { display: block; margin: 4px 0; }
    button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid var(--guinda); background: var(--guinda); color: #fff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    table { border-collapse: collapse; margin: 12px 0; width: 100%; max-width: 720px; }
    td, th { border-bottom: 1px solid var(--borde); padding: 4px 8px; text-align: left; vertical-align: top; }
    .ok { color: var(--ok); } .mal { color: var(--mal); }
    pre { background: color-mix(in srgb, var(--borde) 35%, transparent); padding: 8px; max-height: 320px; overflow: auto; font-size: 12px; white-space: pre-wrap; }
    iframe { width: 100%; height: 80vh; border: 1px solid var(--borde); }
  </style>
</head>
<body>
  <h1>Prueba de compilación en el navegador</h1>
  <p class="nota">IPN Folio · BusyTeX (TeX Live 2026, WASM). Todo se compila en este equipo.</p>

  <fieldset>
    <legend>Proyecto</legend>
    <label><input type="radio" name="origen" value="servidor" checked> Plantilla local del servidor (<code>/proyecto/</code>)</label>
    <label><input type="radio" name="origen" value="carpeta"> Elegir una carpeta: <input type="file" id="carpeta" webkitdirectory></label>
    <label>Archivo principal: <input id="principal" value="Principal.tex" size="24"></label>
  </fieldset>

  <fieldset>
    <legend>Opciones</legend>
    <label><input type="checkbox" id="remoto" checked> Paquetes faltantes desde el endpoint de TeX Live (<code>/texlive/</code>)</label>
    <label><input type="checkbox" id="minusculas"> Corregir mayúsculas: copiar cada <code>.bib</code> también con nombre en minúsculas</label>
    <label><input type="checkbox" id="repetir" checked> Compilar dos veces (mide la segunda, con caché)</label>
  </fieldset>

  <button id="compilar">Compilar</button>
  <span id="estado"></span>

  <table id="tabla" hidden><tbody></tbody></table>
  <details><summary>Bitácora</summary><pre id="bitacora"></pre></details>
  <iframe id="visor" hidden title="PDF generado"></iframe>

  <script type="module" src="prueba.js"></script>
</body>
</html>
